services:
    # image project
    app:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        working_dir: /var/www/
        volumes:
            - ./:/var/www
        depends_on:
            - db
            - redis
        networks:
            - laravel
        environment:
            PHP_MEMORY_LIMIT: 8192M

    # nginx
    nginx:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./:/var/www
            - ./docker/nginx/:/etc/nginx/conf.d/
            - ./ssl:/etc/nginx/ssl
        networks:
            - laravel

    # Banco principal. Imagem com pgvector para a busca vetorial entrar depois
    # sem trocar de imagem; hoje a busca por semelhanca usa pg_trgm, que vem no
    # Postgres padrao.
    db:
        image: pgvector/pgvector:pg17
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE}
            POSTGRES_USER: ${DB_USERNAME}
            POSTGRES_PASSWORD: ${DB_PASSWORD}
        # Servidor compartilhado (8 GB para varios projetos): a base tem ~1,5 GB
        # e o padrao do Postgres (128 MB de cache) a leria do disco o tempo
        # todo, enquanto o automatico de outros bancos pegaria a maquina toda.
        command: >
            postgres
            -c shared_buffers=512MB
            -c effective_cache_size=1536MB
            -c work_mem=16MB
            -c maintenance_work_mem=256MB
            -c max_connections=50
            -c random_page_cost=1.1
        volumes:
            - ./.docker/postgres:/var/lib/postgresql/data
        ports:
            - "5433:5432"
        networks:
            - laravel

    # Adminer no lugar do phpMyAdmin: fala Postgres e ocupa uma fracao da
    # memoria.
    adminer:
        image: adminer:4
        restart: unless-stopped
        environment:
            ADMINER_DEFAULT_SERVER: db
        ports:
            - "8080:8080"
        networks:
            - laravel

    # MySQL antigo, so para a migracao e para voltar atras se preciso. Nao sobe
    # com `docker compose up`; so com `--profile legado`. Os dados continuam
    # onde sempre estiveram, e a senha e a que ja esta gravada neles (estas
    # variaveis so valem para um volume vazio).
    mysql-legado:
        image: mysql:8.0
        platform: linux/x86_64
        profiles: ["legado"]
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_LEGADO_PASSWORD:-}
        volumes:
            - ./.docker/mysql/dbdata:/var/lib/mysql
        networks:
            - laravel

    # redis
    redis:
        image: redis:latest
        # Os outros quatro servicos ja tinham; este ficou de fora e nao voltaria
        # depois de um reboot. Como a aplicacao usa o Redis para cache e sessao,
        # o efeito nao seria "sem cache": seriam erros de conexao no primeiro
        # acesso, num servidor que acabou de subir e aparenta estar bem.
        restart: unless-stopped
        networks:
            - laravel

networks:
    laravel:
        driver: bridge
        ipam:
            config:
                - subnet: "192.168.10.0/24"
                  gateway: "192.168.10.1"
