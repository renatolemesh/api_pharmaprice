services:
    # image project
    app:
        build:
            context: .
            dockerfile: Dockerfile
        restart: unless-stopped
        working_dir: /var/www/
        volumes:
            - ./:/var/www
        depends_on:
            - redis
        networks:
            - laravel
        environment:
            PHP_MEMORY_LIMIT: 8192M

    # nginx
    nginx:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./:/var/www
            - ./docker/nginx/:/etc/nginx/conf.d/
            - ./ssl:/etc/nginx/ssl
        networks:
            - laravel

    # db mysql
    db:
        image: mysql:8.0
        platform: linux/x86_64
        restart: unless-stopped
        environment:
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_PASSWORD: ${DB_PASSWORD}
            MYSQL_USER: ${DB_USERNAME}
        volumes:
            - ./.docker/mysql/dbdata:/var/lib/mysql
        ports:
            - "3300:3306"
        networks:
            - laravel

    # PHPMyAdmin
    phpmyadmin:
        image: phpmyadmin/phpmyadmin
        platform: linux/x86_64
        restart: unless-stopped
        ports:
            - "8080:80"
        environment:
            PMA_HOST: db
            PMA_PORT: 3306
            UPLOAD_LIMIT: 300M
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
        networks:
            - laravel

    # redis
    redis:
        image: redis:latest
        # Os outros quatro servicos ja tinham; este ficou de fora e nao voltaria
        # depois de um reboot. Como a aplicacao usa o Redis para cache e sessao,
        # o efeito nao seria "sem cache": seriam erros de conexao no primeiro
        # acesso, num servidor que acabou de subir e aparenta estar bem.
        restart: unless-stopped
        networks:
            - laravel

networks:
    laravel:
        driver: bridge
        ipam:
            config:
                - subnet: "192.168.10.0/24"
                  gateway: "192.168.10.1"
