# nginx do ambiente LOCAL de testes - somente HTTP.
#
# A config de producao (docker/nginx/laravel.conf) exige os certificados
# Let's Encrypt de api.pharmaprices.shop, que nao existem na maquina de
# desenvolvimento: o nginx entra em loop de restart com "cannot load
# certificate". Aqui e o mesmo servidor, sem TLS e sem redirecionar para https.

server {
    listen 80 default_server;
    server_name localhost;

    client_max_body_size 300M;

    root /var/www/public;
    index index.php;

    fastcgi_read_timeout 600;
    fastcgi_send_timeout 600;
    proxy_read_timeout 600;
    proxy_connect_timeout 600;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
        gzip_static on;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
