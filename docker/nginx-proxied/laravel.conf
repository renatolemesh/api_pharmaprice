# nginx da API rodando ATRAS de um proxy reverso.
#
# O TLS termina no proxy central (nginx-container), que ja atende n8n,
# chatwoot, jira-timesheet e webhook-redirector no mesmo servidor. Este nginx
# so recebe HTTP pela rede interna do Docker, entao nao carrega certificado
# nem redireciona para https - quem faz isso e o proxy.

server {
    listen 80 default_server;
    server_name api.pharmaprices.shop _;

    client_max_body_size 300M;

    root /var/www/public;
    index index.php;

    # O IP real e o esquema original chegam nos cabecalhos do proxy. Sem isto,
    # todo acesso apareceria no log como vindo do proxy, em http.
    set_real_ip_from 0.0.0.0/0;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    fastcgi_read_timeout 600;
    fastcgi_send_timeout 600;
    proxy_read_timeout 600;
    proxy_connect_timeout 600;

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTPS $http_x_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
