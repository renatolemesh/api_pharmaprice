# Compressao das respostas da API.
#
# A imagem oficial do nginx vem com `gzip` comentado no nginx.conf, e o
# `gzip_static` que existia no bloco `location /` so serve arquivo .gz gravado
# em disco - nao faz nada por resposta gerada pelo PHP, que e 100% do que esta
# API devolve. Na pratica nada era comprimido.
#
# JSON comprime muito bem porque repete as mesmas chaves em toda linha. Medido
# contra a producao:
#
#   GET /api/descricoes (sem filtro)   7.748.668 -> 1.465.890 bytes   -81%
#   GET /api/precos?descricao=dipirona    35.315 ->     4.488 bytes   -87%
#   GET /api/dashboard/summary             4.909 ->     1.005 bytes   -80%
#
# Dois detalhes que fazem a diferenca entre isto funcionar e nao funcionar:
#
#   - `application/json` NAO esta no gzip_types padrao do nginx, que so cobre
#     text/html. Sem a linha abaixo, ligar `gzip on` nao mudaria nada aqui.
#   - `gzip_proxied any` porque esta API roda atras do proxy central. Por
#     padrao o nginx se recusa a comprimir resposta de requisicao que chegou
#     com cabecalho `Via`, que e o caso.
gzip on;
gzip_vary on;
gzip_proxied any;
# Nivel 5 e nao o 6 padrao: a diferenca de tamanho e de ~1% e a de CPU nao,
# e o /descricoes chega a 7,7 MB por resposta.
gzip_comp_level 5;
# Abaixo disso o cabecalho de resposta custa mais que a economia.
gzip_min_length 1024;
gzip_types
    application/json
    application/javascript
    application/xml
    text/csv
    text/plain
    text/css
    text/xml
    image/svg+xml;
